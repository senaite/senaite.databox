name: build and test senaite.databox
on:
  - push
  - pull_request
env:
  PLONE_VERSION: "5.2"
jobs:
  build-and-test:
    # ubuntu-20.04 was retired by GitHub, and a job asking for
    # a label nobody provides does not fail: it waits for a
    # runner until the 24 hour timeout cancels it. Python 2.7
    # comes from the container below, so the host image is free
    # to move.
    runs-on: ubuntu-latest
    container:
      image: python:2.7.18-buster
    steps:
      - uses: actions/checkout@v4
      - name: cache eggs
        uses: actions/cache@v4
        with:
          key: eggs-cache-${{ hashFiles('buildout.cfg', 'requirements.txt') }}
          path: |
            eggs/
      - name: install
        run: |
          pip install virtualenv
          virtualenv -p `which python` .
          bin/pip install --upgrade pip
          bin/pip install -r requirements.txt
          bin/buildout -N -t 3 annotate
          bin/buildout -N -t 3
      - name: lint
        run: |
          bin/pip install flake8
          bin/flake8 --config ci_flake8.cfg src/senaite/
      - name: test
        run: |
          bin/test -s senaite.databox.tests
